; Custom Hsin Palette Variables mapped from your configurations
[colors]
background     = #1e1416
background-alt = #362225
foreground     = #eedec8
primary        = #e03e3e
secondary      = #ecc587
alert          = #d02a3a
disabled       = #586070

[bar/top]
bottom = false
;width  = 100%
width  = 1348px
height = 20pt
offset-x = 9px
offset-y = 9px
fixed-center = true
radius = 8

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0px
border-color = #04a5e5

padding-left = 1
padding-right = 1

module-margin = 1

separator = ""
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font:size=12;2

modules-left = i3 xwindow
modules-right = filesystem memory memory-detailed cpu pulseaudio date systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

scroll-up = "#i3.prev"
scroll-down = "#i3.next"

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 1pt
tray-spacing = 3pt
tray-size = 16pt

[module/i3]
type = internal/i3

format = <label-state>

ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;

label-seperator = " "

label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${colors.alert}
label-mode-foreground = ${colors.foreground}

label-focused = %icon%
label-focused-background = ${colors.background-alt}
label-focused-underline  = ${colors.primary}
label-focused-foreground = ${colors.secondary}
label-focused-padding = 1

label-unfocused = %icon%
label-unfocused-padding = 1

label-empty = %name% 
label-empty-foreground = ${colors.disabled}
label-empty-padding = 3

label-urgent = %name% 
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.foreground}
label-urgent-padding = 3

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

format-mounted-prefix = " "
format-unmounted-prefix = " "
format-mounted-prefix-foreground = ${colors.secondary}

label-mounted = %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " 󰕾 "
format-volume-prefix-foreground = ${colors.secondary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 1
format-prefix = "  "
format-prefix-foreground = ${colors.secondary}
format = %{A1:polybar-msg action "#memory-detailed.module_show" && polybar-msg action "#memory.module_hide":}<label>%{A}
label = %percentage_used%%

[module/memory-detailed]
type = internal/memory
interval = 1
hidden = true
format-prefix = "  "
format-prefix-foreground = ${colors.secondary}
format = %{A1:polybar-msg action "#memory.module_show" && polybar-msg action "#memory-detailed.module_hide":}<label>%{A}
label = RAM: %gb_used% / %gb_total% (%percentage_used%%)

[module/cpu]
type = internal/cpu
interval = 3
format-prefix = "  "
format-prefix-foreground = ${colors.secondary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d %H:%M
date-alt = %Y-%m-%d %H:%M

format-prefix = "   "
format-prefix-foreground = ${colors.secondary}
label = %date%
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = false

; vim:ft=dosini
