# =============================================================================
# KITTY TERMINAL CONFIGURATION
# =============================================================================

# --- Typography & Fonts ---
font_family          JetBrains Mono
font_size            11.0

# --- Window Layout & Padding ---
window_padding_width 6

# =============================================================================
# HSIN COLOR THEME
# =============================================================================

# --- Core Interface Colors ---
foreground           #eedec8
background           #1e1416
cursor               #ecc587
selection_background #362225
selection_foreground #eedec8

# --- Transparency Settings ---
background_opacity         0.85
dynamic_background_opacity yes

# --- 16 Terminal Color Matrix ---

# Black (Dark Bases)
color0  #1e1416
color8  #362225

# Red (Vermillion & Cinnabar)
color1  #e0303e
color9  #d02a3a

# Green (Muted Gold / Olive Balance)
color2  #a89a74
color10 #c5b892

# Yellow (Luminous Gold)
color3  #ecc587
color11 #f4dca6

# Blue (Soft Slate Highlights)
color4  #586070
color12 #737f94

# Magenta (Rose Tones)
color5  #a6515b
color13 #c46e79

# Cyan (Vibrant Accents)
color6  #d83ca5
color14 #eedec8

# White (Text / Light Accents)
color7  #eedec8
color15 #ffffff

# =============================================================================
# KEYBINDINGS & SHORTCUTS
# =============================================================================

# --- System Clipboard Integration ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

